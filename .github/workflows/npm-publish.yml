# Runs lint, then publishes the package to npm when a release is published.
# Publishing uses npm Trusted Publishing (OIDC): no npm token is stored in the repo.
# See https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  release:
    # Not [created]: that never fires for a release published from a draft.
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by npm Trusted Publishing to mint the OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Node 24 ships npm 11, which Trusted Publishing needs (>= 11.5.1).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish
